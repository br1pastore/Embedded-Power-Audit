# MediaTek Genio 720 heuristic power profile
#
# Target:
#   MediaTek Genio 720 / MT8391AV
#   2x Cortex-A78 @ up to 2.6 GHz
#   6x Cortex-A55 @ up to 2.0 GHz
#   Mali-G57 MC2 @ up to 1.1 GHz
#   LPDDR5-6400
#
# Reference:
#   MediaTek IoT Yocto v26.0
#   Genio 720/520 EVK High Power measurements
#
# IMPORTANT:
#   This profile is heuristic.
#   The coefficients below are NOT direct electrical measurements.
#   They are initialized using vendor-published Genio 720 EVK data
#   and must be refined with real Embedded Power Audit output.
#
# MediaTek reference, MT8391AV @ Ta=25C:
#
#   stress-ng:
#       EVK  = 3480 mW
#       SoC  = 2270 mW
#       DRAM =  190 mW
#
#   CoreMark:
#       EVK  = 2460 mW
#       SoC  = 1520 mW
#       DRAM =  140 mW
#
#   glmark:
#       EVK  = 2470 mW
#       SoC  = 1190 mW
#       DRAM =  450 mW
#
# Thermal reference:
#   Commercial Tj max : 95 C
#   Thermal throttle  : 85 C
#   sustainable_power : 2500
#

PROFILE_NAME="mediatek-genio720-heuristic"

# ----------------------------------------------------------------------
# Baseline
# ----------------------------------------------------------------------
#
# Intentionally conservative.
# This is not intended to represent MediaTek's measured EVK idle power.
# It represents the model's static/background contribution before
# activity coefficients are applied.
#
BASELINE_IDLE_MW=500

# ----------------------------------------------------------------------
# Dynamic components
# ----------------------------------------------------------------------

# CPU
#
# Genio 720 contains:
#   2x Cortex-A78 @ 2.6 GHz
#   6x Cortex-A55 @ 2.0 GHz
#
# MediaTek stress-ng data shows SoC power around 2.27 W at maximum
# CPU frequencies. CPU is therefore expected to dominate CPU-heavy
# workloads.
#
CPU_DYN_MW=1800

# DDR
#
# Vendor measurements:
#   stress-ng : 190 mW
#   CoreMark  : 140 mW
#   glmark    : 450 mW
#
# Keep sufficient headroom for GPU / memory-intensive workloads.
#
DDR_DYN_MW=500

# Display
#
# Board/display contribution is not isolated by the MediaTek reference
# tables. Keep conservative until a real EVK audit is available.
#
DISPLAY_DYN_MW=450

# USB
#
USB_DYN_MW=180

# Network
#
# Genio EVK includes Ethernet and may use external Wi-Fi connectivity.
# This coefficient covers Linux-visible network activity only.
#
NET_DYN_MW=300

# Storage
#
# Genio 720 EVK reference platform uses UFS 3.1.
#
STORAGE_DYN_MW=250

# Audio
#
AUDIO_DYN_MW=100

# Background / platform devices
#
# Covers devices not directly represented by the generic activity
# model, including clocks, PMIC overhead and active platform blocks.
#
BACKGROUND_DYN_MW=180

# ----------------------------------------------------------------------
# Saturation thresholds
# ----------------------------------------------------------------------

# IRQ rate considered "fully active" for USB/display heuristics.
#
USB_IRQ_SAT=500
DISPLAY_IRQ_SAT=500

# Network throughput saturation.
# 100 Mbit/s is a reasonable starting point for an embedded EVK.
#
NET_BPS_SAT=100000000

# Storage throughput saturation.
# UFS can greatly exceed this; this value intentionally represents the
# point where the heuristic considers storage activity significant,
# rather than the physical maximum throughput.
#
STORAGE_BPS_SAT=50000000