# Starter heuristic profile for Raspberry Pi (Pi 3 / Pi 4 / Pi 5 family).
# These numbers are NOT measured values. They are weights used to build a
# relative power-share estimate from runtime activity.
PROFILE_NAME="raspberrypi-heuristic"
BASELINE_IDLE_MW=300
CPU_DYN_MW=800
DDR_DYN_MW=180
DISPLAY_DYN_MW=420
USB_DYN_MW=170
NET_DYN_MW=140
STORAGE_DYN_MW=70
AUDIO_DYN_MW=35
BACKGROUND_DYN_MW=45
USB_IRQ_SAT=10000000
DISPLAY_IRQ_SAT=10000
NET_BPS_SAT=20000000
STORAGE_BPS_SAT=10000000