# MediaTek Genio 520 heuristic power profile
#
# Target:
#   MediaTek Genio 520 / MT8371AV
#   2x Cortex-A78 @ up to 2.2 GHz
#   6x Cortex-A55 @ up to 2.0 GHz
#   Mali-G57 MC2 @ up to 880 MHz
#   LPDDR5-6400
#
# Reference:
#   MediaTek IoT Yocto v26.0
#   Genio 720/520 EVK High Power and Low Power measurements
#
# IMPORTANT:
#   This profile is heuristic.
#   The coefficients below are NOT direct electrical measurements.
#   They are initialized using vendor-published Genio 520 EVK data
#   and should be refined with real Embedded Power Audit output.
#
# MediaTek reference, MT8371AV @ Ta=25C:
#
#   stress-ng:
#       SoC  = 1740 mW
#       DRAM =  160 mW
#
#   CoreMark:
#       SoC  = 1240 mW
#       DRAM =  130 mW
#
#   glmark:
#       SoC  =  900 mW
#       DRAM =  360 mW
#
# Low-power reference:
#   cluster-off idle EVK      ~= 588 mW
#   suspend EVK               ~= 190 mW
#   suspend, Ethernet disabled ~= 55 mW
#
# The baseline/background values below are intentionally chosen so that
# the modeled static contribution is close to the published cluster-off
# EVK idle figure, while still leaving dynamic activity to be accounted
# for by the workload-dependent coefficients.
#

PROFILE_NAME="mediatek-genio520-heuristic"

# ----------------------------------------------------------------------
# Baseline
# ----------------------------------------------------------------------

BASELINE_IDLE_MW=430

# ----------------------------------------------------------------------
# Dynamic components
# ----------------------------------------------------------------------

# CPU
#
# Genio 520 contains:
#   2x Cortex-A78 @ 2.2 GHz
#   6x Cortex-A55 @ 2.0 GHz
#
# MediaTek stress-ng data shows SoC power around 1.74 W under a
# CPU-intensive workload. The CPU coefficient is therefore kept below
# that full-SoC figure, since interconnect, caches and other blocks also
# contribute to measured SoC power.
#
CPU_DYN_MW=1350

# DDR
#
# Vendor measurements:
#   stress-ng : 160 mW
#   CoreMark  : 130 mW
#   glmark    : 360 mW
#
# Some headroom is retained for memory-intensive workloads.
#
DDR_DYN_MW=400

# Display
#
# Board/display contribution is not isolated by the MediaTek reference
# tables. Keep conservative until real EVK audit data is available.
#
DISPLAY_DYN_MW=450

# USB
#
USB_DYN_MW=180

# Network
#
# Covers Linux-visible wired/wireless network activity.
#
NET_DYN_MW=300

# Storage
#
# Generic Genio 520 EVK storage activity contribution.
#
STORAGE_DYN_MW=250

# Audio
#
AUDIO_DYN_MW=100

# Background / platform devices
#
# Together with BASELINE_IDLE_MW, this gives a modeled static/background
# contribution of about 580 mW, close to MediaTek's published Genio 520
# cluster-off EVK idle measurement.
#
BACKGROUND_DYN_MW=150

# ----------------------------------------------------------------------
# Saturation thresholds
# ----------------------------------------------------------------------

# IRQ rate considered "fully active" for USB/display heuristics.
#
USB_IRQ_SAT=500
DISPLAY_IRQ_SAT=500

# Network throughput saturation.
#
NET_BPS_SAT=100000000

# Storage throughput saturation.
#
STORAGE_BPS_SAT=50000000
